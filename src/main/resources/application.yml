server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: backend
  
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:milidb}
    username: ${DB_USER:mili}
    password: ${DB_PASSWORD:admin123}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 2000
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    br.com.mili.backend: ${LOG_LEVEL:DEBUG} 

app:
  jwt:
    secret: ${JWT_SECRET:070bf38968c95f41ec7c1760b1cd46f5929f26e3e61bce4ecfa3230b4ac578c7}
    expiration: 3600
    cookie-name: access_token
    cookie-domain: ${JWT_COOKIE_DOMAIN:localhost}
    cookie-secure: ${JWT_COOKIE_SECURE:false}  # DEVE ser 'true' em produção com HTTPS
    cookie-samesite: ${JWT_COOKIE_SAMESITE:Lax} # Geralmente 'None' para produção com HTTPS